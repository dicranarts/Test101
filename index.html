<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test101</title>
    
    <!-- Fonts: Gochi Hand for title & Roboto for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'title': ['"Gochi Hand"', 'cursive'],
                        'body': ['"Roboto"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS Variables for Dynamic Color Theme on Icons/Buttons */
        :root {
            --theme-accent: #a855f7; /* Default cosmic purple */
            --theme-accent-glow: rgba(168, 85, 247, 0.4);
            --theme-accent-hover: #9333ea;
        }

        .theme-accent-color { color: var(--theme-accent) !important; }
        .theme-accent-bg { background-color: var(--theme-accent) !important; }
        .theme-accent-border { border-color: var(--theme-accent) !important; }
        .theme-accent-glow { box-shadow: 0 0 20px var(--theme-accent-glow); }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Glassmorphism Styles */
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Range Slider Styling */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--theme-accent);
            cursor: pointer;
            box-shadow: 0 0 10px var(--theme-accent-glow);
            transition: transform 0.1s ease, background-color 0.3s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Subtle Fade Transitions */
        .sky-canvas {
            transition: opacity 1.5s ease-in-out;
        }
    </style>
</head>
<body class="font-body bg-slate-950 text-slate-100 min-h-full flex flex-col justify-between relative overflow-x-hidden select-none">

    <!-- CANVAS 1: Animated Sky Engine (Day, Sunset, Night, Dawn + Celestial Bodies) -->
    <canvas id="skyCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-0 sky-canvas"></canvas>

    <!-- Header Banner -->
    <header class="relative z-10 pt-8 pb-4 text-center px-4">
        <h1 class="font-title text-6xl md:text-7xl text-amber-300 drop-shadow-[0_4px_12px_rgba(0,0,0,0.8)] tracking-wide transform -rotate-1">
            Test101
        </h1>
        <p class="mt-2 text-lg md:text-xl text-slate-200 font-light max-w-xl mx-auto drop-shadow-md">
            Hagamos un test y verifiquemos una teoría.
        </p>
    </header>

    <!-- Main Container -->
    <main class="relative z-10 max-w-xl w-full mx-auto px-4 py-4 flex-1 flex flex-col justify-center">
        
        <!-- Form Container -->
        <div class="glass-card rounded-3xl p-6 md:p-8 shadow-2xl relative overflow-hidden transition-all duration-500">
            
            <!-- Zodiac Emblem Floating Badge -->
            <div id="zodiac-badge" class="hidden absolute top-4 right-4 flex items-center gap-2 bg-white/10 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 text-xs font-medium text-amber-200 transition-all duration-500 transform scale-95 opacity-0">
                <span id="zodiac-icon" class="text-lg"></span>
                <span id="zodiac-name" class="capitalize"></span>
            </div>

            <form id="test101-form" class="space-y-5" onsubmit="handleFormSubmit(event)">
                
                <!-- 1. Nombre -->
                <div>
                    <label class="block text-sm font-medium text-slate-200 mb-1 flex items-center gap-2">
                        <i data-lucide="user" class="w-4 h-4 theme-accent-color transition-colors duration-300"></i>
                        ¿Cuál es tu nombre?
                    </label>
                    <input 
                        type="text" 
                        id="nombre" 
                        required 
                        placeholder="Escribe tu nombre aquí"
                        class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700/80 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500/50 transition duration-200"
                        oninput="onNameInput(this.value); updateProgress();"
                    />
                </div>

                <!-- 2. Apellido -->
                <div>
                    <label class="block text-sm font-medium text-slate-200 mb-1 flex items-center gap-2">
                        <i data-lucide="user-check" class="w-4 h-4 theme-accent-color transition-colors duration-300"></i>
                        ¿Y tu apellido?
                    </label>
                    <input 
                        type="text" 
                        id="apellido" 
                        required 
                        placeholder="Escribe tu apellido aquí"
                        class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700/80 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500/50 transition duration-200"
                        oninput="updateProgress()"
                    />
                </div>

                <!-- 3. Fecha de Nacimiento -->
                <div>
                    <label class="block text-sm font-medium text-slate-200 mb-1 flex items-center gap-2">
                        <i data-lucide="calendar" class="w-4 h-4 theme-accent-color transition-colors duration-300"></i>
                        ¿Cuándo naciste?
                    </label>
                    <input 
                        type="date" 
                        id="fechaNacimiento" 
                        required 
                        class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700/80 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500/50 transition duration-200 [color-scheme:dark]"
                        onchange="onDateChange(this.value); updateProgress();"
                    />
                </div>

                <!-- 4. Hora de Nacimiento (Cinematic 15-min Slider) -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-sm font-medium text-slate-200 flex items-center gap-2">
                            <i data-lucide="clock" class="w-4 h-4 theme-accent-color transition-colors duration-300"></i>
                            ¿A qué hora naciste?
                        </label>
                        <span id="horaDisplay" class="text-xs font-bold text-amber-300 bg-slate-900/90 px-2.5 py-1 rounded-md border border-slate-700">
                            12:00 PM
                        </span>
                    </div>
                    
                    <div class="pt-2">
                        <input 
                            type="range" 
                            id="horaRange" 
                            min="0" 
                            max="1425" 
                            step="15" 
                            value="720"
                            class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer focus:outline-none"
                            oninput="onTimeSliderInput(this.value); updateProgress();"
                        />
                        <div class="flex justify-between text-[11px] text-slate-400 mt-1.5 px-0.5">
                            <span>00:00 (Medianoche)</span>
                            <span>06:00 (Amanecer)</span>
                            <span>12:00 (Mediodía)</span>
                            <span>18:00 (Atardecer)</span>
                            <span>23:45</span>
                        </div>
                    </div>
                </div>

                <!-- 5. Ciudad de Nacimiento (Global Database Search) -->
                <div class="relative">
                    <label class="block text-sm font-medium text-slate-200 mb-1 flex items-center gap-2">
                        <i data-lucide="map-pin" class="w-4 h-4 theme-accent-color transition-colors duration-300"></i>
                        ¿En qué ciudad naciste?
                    </label>
                    <div class="relative">
                        <input 
                            type="text" 
                            id="ciudadNacimiento" 
                            required 
                            autocomplete="off"
                            placeholder="Busca o escribe tu ciudad natal..."
                            class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700/80 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500/50 transition duration-200"
                            oninput="onCitySearchInput(this.value); updateProgress();"
                            onfocus="showCityDropdown()"
                        />
                        <div id="city-spinner" class="hidden absolute right-3 top-3.5">
                            <i data-lucide="loader-2" class="w-5 h-5 theme-accent-color animate-spin"></i>
                        </div>
                    </div>

                    <!-- Autocomplete Dropdown List -->
                    <div 
                        id="city-dropdown" 
                        class="hidden absolute z-30 left-0 right-0 mt-1 max-h-48 overflow-y-auto bg-slate-900/95 border border-slate-700/80 rounded-xl shadow-xl backdrop-blur-md p-1 space-y-0.5"
                    ></div>
                </div>

                <!-- 6. Correo Electrónico -->
                <div>
                    <label class="block text-sm font-medium text-slate-200 mb-1 flex items-center gap-2">
                        <i data-lucide="mail" class="w-4 h-4 theme-accent-color transition-colors duration-300"></i>
                        Tu correo electrónico
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        required 
                        placeholder="tu@correo.com"
                        class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700/80 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500/50 transition duration-200"
                        oninput="updateProgress()"
                    />
                </div>

                <!-- Form Progress Bar -->
                <div class="pt-2">
                    <div class="flex justify-between items-center text-xs text-slate-300 mb-1">
                        <span>Progreso del test</span>
                        <span id="progress-percent" class="font-bold theme-accent-color">0%</span>
                    </div>
                    <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                        <div 
                            id="progress-bar" 
                            class="h-full theme-accent-bg transition-all duration-300 rounded-full w-0"
                        ></div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submit-btn"
                    class="w-full py-3.5 px-6 rounded-xl font-medium text-white theme-accent-bg theme-accent-glow hover:opacity-90 active:scale-[0.99] transition-all duration-200 flex items-center justify-center gap-2 shadow-lg mt-4 cursor-pointer"
                >
                    <i data-lucide="send" class="w-4 h-4"></i>
                    <span>Completar y enviar test</span>
                </button>

            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 py-4 text-center text-xs text-slate-400">
        <p>Test101 &bull; Experiencia interactiva</p>
    </footer>

    <!-- Toast Notification Container -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 max-w-sm glass-card p-4 rounded-xl shadow-2xl flex items-center gap-3 border border-slate-700 hidden transition-all duration-300 transform translate-y-4 opacity-0">
        <i id="toast-icon" data-lucide="info" class="w-5 h-5 theme-accent-color"></i>
        <div id="toast-message" class="text-xs text-slate-200"></div>
    </div>

    <!-- Script Application Logic -->
    <script>
        /* ==========================================
           1. CONFIGURATION & STATE MANAGEMENT
           ========================================== */
        const GOOGLE_SHEET_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbx_PLACEHOLDER_REPLACE_WITH_YOUR_APPS_SCRIPT_URL/exec';
        
        let currentTargetHour = 12; // 0 to 24 in float
        let citySearchTimeout = null;

        // Astrological Zodiac Data Mapping
        const ZODIAC_SIGNS = [
            { name: "Capricornio", symbol: "♑", start: [12, 22], end: [1, 19] },
            { name: "Acuario", symbol: "♒", start: [1, 20], end: [2, 18] },
            { name: "Piscis", symbol: "♓", start: [2, 19], end: [3, 20] },
            { name: "Aries", symbol: "♈", start: [3, 21], end: [4, 19] },
            { name: "Tauro", symbol: "♉", start: [4, 20], end: [5, 20] },
            { name: "Géminis", symbol: "♊", start: [5, 21], end: [6, 20] },
            { name: "Cáncer", symbol: "♋", start: [6, 21], end: [7, 22] },
            { name: "Leo", symbol: "♌", start: [7, 23], end: [8, 22] },
            { name: "Virgo", symbol: "♍", start: [8, 23], end: [9, 22] },
            { name: "Libra", symbol: "♎", start: [9, 23], end: [10, 22] },
            { name: "Escorpio", symbol: "♏", start: [10, 23], end: [11, 21] },
            { name: "Sagitario", symbol: "♐", start: [11, 22], end: [12, 21] }
        ];

        /* ==========================================
           2. CANVAS DYNAMIC SKY ENGINE (Day/Dusk/Night/Dawn)
           ========================================== */
        const skyCanvas = document.getElementById('skyCanvas');
        const ctx = skyCanvas.getContext('2d');
        
        let canvasWidth = skyCanvas.width = window.innerWidth;
        let canvasHeight = skyCanvas.height = window.innerHeight;

        // Generate static star particles
        const stars = Array.from({ length: 180 }, () => ({
            x: Math.random() * canvasWidth,
            y: Math.random() * canvasHeight,
            radius: Math.random() * 1.5 + 0.5,
            alpha: Math.random(),
            speed: Math.random() * 0.015 + 0.005
        }));

        function resizeCanvas() {
            canvasWidth = skyCanvas.width = window.innerWidth;
            canvasHeight = skyCanvas.height = window.innerHeight;
            stars.forEach(s => {
                s.x = Math.random() * canvasWidth;
                s.y = Math.random() * canvasHeight;
            });
        }

        // Color interpolation helper
        function interpolateColor(color1, color2, factor) {
            const result = color1.slice();
            for (let i = 0; i < 3; i++) {
                result[i] = Math.round(result[i] + factor * (color2[i] - color1[i]));
            }
            return `rgb(${result[0]}, ${result[1]}, ${result[2]})`;
        }

        function getSkyGradients(hour) {
            // Colors in [R, G, B]
            const NIGHT_TOP = [5, 8, 22];
            const NIGHT_BOT = [15, 23, 42];

            const DAWN_TOP = [26, 21, 52];
            const DAWN_BOT = [217, 119, 6];

            const DAY_TOP = [14, 116, 144];
            const DAY_BOT = [56, 189, 248];

            const DUSK_TOP = [48, 21, 58];
            const DUSK_BOT = [225, 29, 72];

            let topColor, botColor, starAlpha, isDay;

            if (hour >= 0 && hour < 5) {
                // Deep Night
                topColor = NIGHT_TOP;
                botColor = NIGHT_BOT;
                starAlpha = 1.0;
                isDay = false;
            } else if (hour >= 5 && hour < 8) {
                // Dawn transition
                const factor = (hour - 5) / 3;
                topColor = interpolateColor(NIGHT_TOP, DAWN_TOP, factor);
                botColor = interpolateColor(NIGHT_BOT, DAWN_BOT, factor);
                starAlpha = 1.0 - factor;
                isDay = factor > 0.6;
            } else if (hour >= 8 && hour < 17) {
                // Daylight
                topColor = DAY_TOP;
                botColor = DAY_BOT;
                starAlpha = 0.0;
                isDay = true;
            } else if (hour >= 17 && hour < 20) {
                // Sunset / Dusk transition
                const factor = (hour - 17) / 3;
                topColor = interpolateColor(DAY_TOP, DUSK_TOP, factor);
                botColor = interpolateColor(DAY_BOT, DUSK_BOT, factor);
                starAlpha = factor;
                isDay = factor < 0.5;
            } else {
                // Returning to Night
                const factor = (hour - 20) / 4;
                topColor = interpolateColor(DUSK_TOP, NIGHT_TOP, factor);
                botColor = interpolateColor(DUSK_BOT, NIGHT_BOT, factor);
                starAlpha = 1.0;
                isDay = false;
            }

            return { topColor, botColor, starAlpha, isDay };
        }

        function renderSky() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            const { topColor, botColor, starAlpha, isDay } = getSkyGradients(currentTargetHour);

            // 1. Sky Gradient Background
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvasHeight);
            skyGrad.addColorStop(0, typeof topColor === 'string' ? topColor : `rgb(${topColor.join(',')})`);
            skyGrad.addColorStop(1, typeof botColor === 'string' ? botColor : `rgb(${botColor.join(',')})`);
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // 2. Stars rendering with dynamic alpha
            if (starAlpha > 0.05) {
                stars.forEach(star => {
                    star.alpha += star.speed;
                    if (star.alpha > 1 || star.alpha < 0.2) star.speed = -star.speed;

                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha) * starAlpha})`;
                    ctx.fill();
                });
            }

            // 3. Sun / Moon celestial trajectory calculation
            const sunAngle = ((currentTargetHour - 6) / 12) * Math.PI; // -PI/2 at 6am, 0 at 12pm, PI/2 at 6pm
            const cx = canvasWidth / 2;
            const cy = canvasHeight * 0.85;
            const rx = canvasWidth * 0.42;
            const ry = canvasHeight * 0.55;

            if (currentTargetHour >= 5.5 && currentTargetHour <= 18.5) {
                // Sun Visible
                const sunX = cx + rx * Math.cos(sunAngle - Math.PI/2);
                const sunY = cy + ry * Math.sin(sunAngle - Math.PI/2);

                const sunGlow = ctx.createRadialGradient(sunX, sunY, 5, sunX, sunY, 40);
                sunGlow.addColorStop(0, 'rgba(254, 240, 138, 0.9)');
                sunGlow.addColorStop(0.4, 'rgba(251, 191, 36, 0.4)');
                sunGlow.addColorStop(1, 'rgba(251, 191, 36, 0)');

                ctx.beginPath();
                ctx.arc(sunX, sunY, 40, 0, Math.PI * 2);
                ctx.fillStyle = sunGlow;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(sunX, sunY, 14, 0, Math.PI * 2);
                ctx.fillStyle = '#FEF08A';
                ctx.fill();
            } else {
                // Moon Visible
                const moonHour = (currentTargetHour + 12) % 24;
                const moonAngle = ((moonHour - 6) / 12) * Math.PI;
                const moonX = cx + rx * Math.cos(moonAngle - Math.PI/2);
                const moonY = cy + ry * Math.sin(moonAngle - Math.PI/2);

                const moonGlow = ctx.createRadialGradient(moonX, moonY, 4, moonX, moonY, 30);
                moonGlow.addColorStop(0, 'rgba(226, 232, 240, 0.8)');
                moonGlow.addColorStop(0.5, 'rgba(148, 163, 184, 0.2)');
                moonGlow.addColorStop(1, 'rgba(148, 163, 184, 0)');

                ctx.beginPath();
                ctx.arc(moonX, moonY, 30, 0, Math.PI * 2);
                ctx.fillStyle = moonGlow;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(moonX, moonY, 12, 0, Math.PI * 2);
                ctx.fillStyle = '#E2E8F0';
                ctx.fill();
            }

            requestAnimationFrame(renderSky);
        }

        /* ==========================================
           3. GENDER REACTION (Tints Form Icons & Buttons)
           ========================================== */
        function onNameInput(name) {
            if (!name || name.trim().length === 0) {
                applyThemeColor('#a855f7', 'rgba(168, 85, 247, 0.4)', '#9333ea'); // Default purple
                return;
            }

            const firstName = name.trim().split(' ')[0].toLowerCase();
            
            // Heuristic detection based on common Spanish naming endings
            const isFeminine = /[aei]$/i.test(firstName) && !['jose', 'jorge', 'felipe', 'lupe', 'jaime', 'rene'].includes(firstName);
            const isMasculine = /[or]$/i.test(firstName) || ['jose', 'jorge', 'luis', 'carlos', 'juan', 'manuel', 'pedro'].includes(firstName);

            if (isFeminine) {
                applyThemeColor('#ec4899', 'rgba(236, 72, 153, 0.4)', '#db2777'); // Pink
            } else if (isMasculine) {
                applyThemeColor('#3b82f6', 'rgba(59, 130, 246, 0.4)', '#2563eb'); // Blue
            } else {
                applyThemeColor('#a855f7', 'rgba(168, 85, 247, 0.4)', '#9333ea'); // Neutral Purple
            }
        }

        function applyThemeColor(primary, glow, hover) {
            document.documentElement.style.setProperty('--theme-accent', primary);
            document.documentElement.style.setProperty('--theme-accent-glow', glow);
            document.documentElement.style.setProperty('--theme-accent-hover', hover);
        }

        /* ==========================================
           4. ZODIAC CALCULATION
           ========================================== */
        function onDateChange(dateString) {
            if (!dateString) return;
            const date = new Date(dateString + 'T00:00:00');
            const month = date.getMonth() + 1;
            const day = date.getDate();

            const sign = ZODIAC_SIGNS.find(z => {
                const [sM, sD] = z.start;
                const [eM, eD] = z.end;
                if (sM === 12 && month === 12) return day >= sD;
                if (sM === 12 && month === 1) return day <= eD;
                return (month === sM && day >= sD) || (month === eM && day <= eD);
            }) || ZODIAC_SIGNS[0];

            const badge = document.getElementById('zodiac-badge');
            document.getElementById('zodiac-icon').innerText = sign.symbol;
            document.getElementById('zodiac-name').innerText = sign.name;

            badge.classList.remove('hidden');
            setTimeout(() => {
                badge.classList.remove('scale-95', 'opacity-0');
                badge.classList.add('scale-100', 'opacity-100');
            }, 50);
        }

        /* ==========================================
           5. TIME SLIDER HANDLING (15-min Granularity)
           ========================================== */
        function onTimeSliderInput(minutesValue) {
            const totalMinutes = parseInt(minutesValue, 10);
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;

            currentTargetHour = hours + (minutes / 60);

            // Format 12-hour AM/PM string
            const period = hours >= 12 ? 'PM' : 'AM';
            const displayHours = hours % 12 === 0 ? 12 : hours % 12;
            const displayMinutes = minutes < 10 ? `0${minutes}` : minutes;

            document.getElementById('horaDisplay').innerText = `${displayHours}:${displayMinutes} ${period}`;
        }

        /* ==========================================
           6. GLOBAL CITY AUTOCOMPLETE (Open-Meteo DB API)
           ========================================== */
        async function onCitySearchInput(query) {
            clearTimeout(citySearchTimeout);
            const dropdown = document.getElementById('city-dropdown');
            const spinner = document.getElementById('city-spinner');

            if (!query || query.trim().length < 2) {
                dropdown.classList.add('hidden');
                spinner.classList.add('hidden');
                return;
            }

            spinner.classList.remove('hidden');

            citySearchTimeout = setTimeout(async () => {
                try {
                    const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=8&language=es&format=json`);
                    const data = await response.json();
                    
                    spinner.classList.add('hidden');
                    renderCityOptions(data.results || []);
                } catch (err) {
                    console.error("Error cargando ciudades:", err);
                    spinner.classList.add('hidden');
                }
            }, 300);
        }

        function renderCityOptions(cities) {
            const dropdown = document.getElementById('city-dropdown');
            dropdown.innerHTML = '';

            if (cities.length === 0) {
                dropdown.innerHTML = `<div class="p-2.5 text-xs text-slate-400 text-center">No encontramos coincidencias. Puedes escribirla directamente.</div>`;
            } else {
                cities.forEach(city => {
                    const item = document.createElement('div');
                    item.className = 'px-3.5 py-2.5 text-xs text-slate-200 hover:bg-slate-800 rounded-lg cursor-pointer transition-colors flex justify-between items-center';
                    
                    const countryText = city.country ? `, ${city.country}` : '';
                    const adminText = city.admin1 ? ` (${city.admin1})` : '';

                    item.innerHTML = `
                        <div>
                            <div class="font-medium text-white">${city.name}</div>
                            <div class="text-[10px] text-slate-400">${adminText}${countryText}</div>
                        </div>
                        <i data-lucide="map-pin" class="w-3.5 h-3.5 theme-accent-color"></i>
                    `;
                    item.onclick = () => selectCityOption(`${city.name}${countryText}`);
                    dropdown.appendChild(item);
                });
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }

            dropdown.classList.remove('hidden');
        }

        function selectCityOption(fullCityName) {
            const cityInput = document.getElementById('ciudadNacimiento');
            cityInput.value = fullCityName;
            document.getElementById('city-dropdown').classList.add('hidden');
            updateProgress();
        }

        function showCityDropdown() {
            const query = document.getElementById('ciudadNacimiento').value;
            if (query && query.trim().length >= 2) {
                onCitySearchInput(query);
            }
        }

        // Close dropdown on outside click
        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('city-dropdown');
            const cityInput = document.getElementById('ciudadNacimiento');
            if (dropdown && !dropdown.contains(e.target) && e.target !== cityInput) {
                dropdown.classList.add('hidden');
            }
        });

        /* ==========================================
           7. FORM PROGRESS & SUBMISSION HANDLER
           ========================================== */
        function updateProgress() {
            const fields = [
                document.getElementById('nombre').value.trim(),
                document.getElementById('apellido').value.trim(),
                document.getElementById('fechaNacimiento').value,
                document.getElementById('horaRange').value,
                document.getElementById('ciudadNacimiento').value.trim(),
                document.getElementById('email').value.trim()
            ];

            const filledCount = fields.filter(val => val !== '').length;
            const percent = Math.round((filledCount / fields.length) * 100);

            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-percent').innerText = `${percent}%`;
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            const originalBtnContent = submitBtn.innerHTML;

            const formData = {
                nombre: document.getElementById('nombre').value.trim(),
                apellido: document.getElementById('apellido').value.trim(),
                fechaNacimiento: document.getElementById('fechaNacimiento').value,
                horaNacimiento: document.getElementById('horaDisplay').innerText,
                ciudadNacimiento: document.getElementById('ciudadNacimiento').value.trim(),
                email: document.getElementById('email').value.trim(),
                timestamp: new Date().toISOString()
            };

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> <span>Enviando respuestas...</span>`;
            if (typeof lucide !== 'undefined') lucide.createIcons();

            try {
                // Post data to Google Apps Script Endpoint
                await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (typeof confetti === 'function') confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
                showToast("¡Test completado exitosamente!", "success");
                
                setTimeout(() => {
                    document.getElementById('test101-form').reset();
                    document.getElementById('horaRange').value = '720';
                    onTimeSliderInput(720);
                    
                    const badge = document.getElementById('zodiac-badge');
                    badge.classList.add('scale-95', 'opacity-0');
                    setTimeout(() => badge.classList.add('hidden'), 300);

                    onNameInput('');
                    updateProgress();
                }, 3000);

            } catch (error) {
                console.error("Error enviando respuestas:", error);
                showToast("Hubo un detalle al conectar con Google Sheets.", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnContent;
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = message;
            
            if (type === 'success') {
                toastIcon.setAttribute('data-lucide', 'check-circle');
                toastIcon.className = "w-5 h-5 text-emerald-400";
            } else if (type === 'error') {
                toastIcon.setAttribute('data-lucide', 'alert-circle');
                toastIcon.className = "w-5 h-5 text-rose-400";
            } else {
                toastIcon.setAttribute('data-lucide', 'info');
                toastIcon.className = "w-5 h-5 theme-accent-color";
            }

            if (typeof lucide !== 'undefined') lucide.createIcons();
            toast.classList.remove('hidden', 'translate-y-4', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 4000);
        }

        /* ==========================================
           8. INITIALIZATION
           ========================================== */
        window.onload = function() {
            resizeCanvas();
            renderSky();
            if (typeof lucide !== 'undefined') lucide.createIcons();
            onTimeSliderInput(720);
            updateProgress();

            window.addEventListener('resize', resizeCanvas);
        };
    </script>
</body>
</html>
